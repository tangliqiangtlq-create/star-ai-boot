server:
  port: ${SERVER_PORT:9000}
  servlet:
    context-path: /xxl-job-admin
  #Data source configuration
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_SERVICE_HOST:127.0.0.1}:${MYSQL_SERVICE_PORT:3306}/${MYSQL_SERVICE_DB_NAME:?MYSQL_SERVICE_DB_NAME is required for xxl-job (per-schema name; do not fallback legacy xxl_job default)}?characterEncoding=UTF-8&useUnicode=true&useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false&verifyServerCertificate=true&serverTimezone=UTC
    username: ${MYSQL_USER:?MYSQL_USER is required for xxl-job-admin; N8 forbids falling back to root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # B11-1 Hikari CP defaults
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:8}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:30}
      auto-commit: true
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:8000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:60000}
      pool-name: HikariCP-XXL
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:120000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:2000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      connection-test-query: SELECT 1
      transaction-isolation: ${SPRING_DATASOURCE_HIKARI_TX_ISOLATION:TRANSACTION_READ_COMMITTED}
  #Email configuration
  mail:
    host: smtphz.qiye.163.com
    port: 994
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
  #MVC configuration
  mvc:
    servlet:
      load-on-startup: 0
    static-path-pattern: /static/**
  resources:
    static-locations: classpath:/static/
  #freemarker configuration
  freemarker:
    templateLoaderPath=classpath: /templates/
    suffix: .ftl
    charset: UTF-8
    request-context-attribute: request
    settings:
      number_format: 0.##########
#Common configuration, open endpoints
management:
  server:
    servlet:
      context-path: /actuator
  health:
    mail:
      enabled: false
#mybatis configuration
mybatis:
  mapper-locations: classpath:/mybatis-mapper/*Mapper.xml
#XXL-job configuration
xxl:
  job:
    login:
      # Disable the default value of weak passwords in the warehouse; environment variables must be injected during deployment
      username: ${XXL_JOB_ADMIN_USER:}
      password: ${XXL_JOB_ADMIN_PWD:}
    accessToken: ${XXL_JOB_ACCESS_TOKEN}
    i18n: en
    #trigger pool
    triggerpool:
      fast:
        max: 200
      slow:
        max: 100
    # Auto-clean schedule logs older than N days (min 7; <7 disables). JobLogReportHelper runs daily.
    logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:7}